<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学错题本</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>数学错题本</h1>
        <p class="subtitle">拍照上传 · 分类管理 · 随时回顾</p>
    </header>

    <main>
        <!-- 上传区 -->
        <section class="upload-card">
            <h2>拍错题</h2>
            <div class="photo-picker">
                <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
                <button type="button" id="pickPhotoBtn" class="btn btn-primary btn-large">
                    📷 拍照 / 选择照片
                </button>
                <div id="photoPreview" class="photo-preview" hidden>
                    <img id="previewImg" alt="预览">
                </div>
            </div>
            <button type="button" id="submitBtn" class="btn btn-primary btn-large">保存错题</button>
            <button type="button" class="btn btn-large" onclick="window.open('/static/paper.html', '_blank')">📝 用错题生成练习卷</button>
            <p class="hint">可拍整页作业；系统会自动校正页面，并按红色批改标记切分错题</p>
            <div id="uploadMsg" class="msg" hidden></div>
        </section>

        <!-- 列表区 -->
        <section id="questionList" class="card-grid"></section>
        <p id="emptyHint" class="empty-hint" hidden>还没有错题，先拍一道吧！</p>
    </main>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="modal" hidden>
        <div class="modal-content">
            <h3>编辑错题</h3>
            <label>知识点 / 错误原因<input type="text" id="editKnowledgePoint" list="kpList"></label>
            <label>备注<textarea id="editNote" rows="3"></textarea></label>
            <datalist id="kpList"></datalist>
            <div class="modal-actions">
                <button type="button" id="editSaveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="editCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 手动四点校正 -->
    <div id="manualCorrectModal" class="modal" hidden>
        <div class="modal-content manual-correct-content">
            <h3>手动放平原卷</h3>
            <p id="manualCorrectHint" class="hint">依次点击：左上角、右上角、右下角、左下角</p>
            <canvas id="manualCorrectCanvas"></canvas>
            <div class="modal-actions">
                <button type="button" id="manualCorrectResetBtn" class="btn">重新选点</button>
                <button type="button" id="manualCorrectApplyBtn" class="btn btn-primary" disabled>确认放平</button>
                <button type="button" id="manualCorrectCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 错题切割确认 -->
    <div id="cropReviewModal" class="modal" hidden>
        <div class="modal-content crop-review-content">
            <h3>确认错题切割</h3>
            <p id="cropReviewHint" class="hint">彩色框是候选错题。拖动框出新范围；点击下方标签可删除错误范围。</p>
            <canvas id="cropReviewCanvas"></canvas>
            <div id="cropRangeList" class="crop-range-list"></div>
            <div class="modal-actions">
                <button type="button" id="cropClearBtn" class="btn">清空范围</button>
                <button type="button" id="cropConfirmBtn" class="btn btn-primary">确认保存</button>
                <button type="button" id="cropCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 练习卷答案遮挡 -->
    <div id="answerMaskModal" class="modal" hidden>
        <div class="modal-content answer-mask-content">
            <h3>遮挡原答案</h3>
            <p class="hint">在图片上拖框遮住孩子答案或批改痕迹。点击下方标签可删除遮挡；原图不会改变。</p>
            <canvas id="answerMaskCanvas"></canvas>
            <div id="answerMaskList" class="crop-range-list"></div>
            <div class="modal-actions">
                <button type="button" id="answerMaskClearBtn" class="btn">清空遮挡</button>
                <button type="button" id="answerMaskSaveBtn" class="btn btn-primary">保存遮挡</button>
                <button type="button" id="answerMaskCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 大图查看 -->
    <div id="lightbox" class="modal" hidden>
        <div class="lightbox-content">
            <img id="lightboxImg" alt="题目大图">
            <button type="button" id="lightboxCloseBtn" class="btn">关闭</button>
        </div>
    </div>

    <script src="/static/app.js?v=20260909-8"></script>
</body>
</html>
