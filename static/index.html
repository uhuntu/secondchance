<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温故</title>
    <link rel="stylesheet" href="/static/style.css?v=20261014-flow">
</head>
<body>
    <header>
        <h1>温故</h1>
        <p class="subtitle">把这次没做会的题，再做一次。</p>
    </header>

    <main>
        <section class="upload-card">
            <p class="step-label">01 拍作业</p>
            <h2>今天重练哪几道？</h2>
            <div class="photo-picker">
                <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
                <button type="button" id="pickPhotoBtn" class="btn btn-primary btn-large">
                    📷 拍照 / 选择照片
                </button>
                <div id="photoPreview" class="photo-preview" hidden>
                    <img id="previewImg" alt="预览">
                </div>
            </div>
            <button type="button" id="submitBtn" class="btn btn-primary btn-large" hidden>用这张照片</button>
            <p class="hint">拍一页作业，接着看一眼题目，选出需要重练的几道。</p>
            <div id="uploadMsg" class="msg" hidden></div>
        </section>

        <section class="review-heading">
            <div><p class="step-label">02 选题</p><h2 id="listTitle">本次重练</h2></div>
            <button type="button" id="libraryBtn" class="btn">从以前的题里选</button>
        </section>
        <p class="hint">勾选要打印的题。需要遮答案或调整切题时，展开“修正”。</p>
        <section id="questionList" class="card-grid"></section>
        <p id="emptyHint" class="empty-hint" hidden>拍一页新作业，或从以前的题里选几道。</p>
        <section class="print-bar" aria-label="本次练习卷">
            <div><p class="step-label">03 打印</p><strong id="selectionCount" aria-live="polite">已选 0 道题</strong></div>
            <button type="button" id="clearSelectionBtn" class="btn">开始新一卷</button>
            <button type="button" id="printSelectedBtn" class="btn btn-primary" disabled>预览并打印</button>
        </section>
    </main>

    <!-- 备注编辑弹窗 -->
    <div id="editModal" class="modal" hidden>
        <div class="modal-content">
            <h3>编辑错题</h3>
            <label>知识点 / 错误原因<input type="text" id="editKnowledgePoint" list="kpList"></label>
            <label>备注<textarea id="editNote" rows="3"></textarea></label>
            <datalist id="kpList"></datalist>
            <div class="modal-actions">
                <button type="button" id="editSaveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="editCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 分割线编辑器：划线代替画框 -->
    <div id="splitModal" class="modal" hidden>
        <div class="modal-content split-content">
            <h3>调整切题</h3>
            <p class="split-hint">两条线之间就是一道错题。<b>拖动</b>红色圆点移动分割线，<b>点空白处</b>加一条线；删线请点下方的标签。</p>
            <canvas id="splitCanvas"></canvas>
            <div class="split-status">
                <span id="splitCount"></span>
                <button type="button" id="splitStraightenBtn" class="btn btn-small">照片歪了？手动摆正</button>
            </div>
            <div id="splitLineChips" class="line-chips"></div>
            <div class="modal-actions">
                <button type="button" id="splitResetBtn" class="btn">重新自动切</button>
                <button type="button" id="splitCancelBtn" class="btn">取消</button>
                <button type="button" id="splitSaveBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 手动四点摆正 -->
    <div id="cornerModal" class="modal" hidden>
        <div class="modal-content corner-content">
            <h3>手动摆正</h3>
            <p id="cornerHint" class="hint">依次点击：左上角、右上角、右下角、左下角</p>
            <canvas id="cornerCanvas"></canvas>
            <div class="modal-actions">
                <button type="button" id="cornerResetBtn" class="btn">重新选点</button>
                <button type="button" id="cornerApplyBtn" class="btn btn-primary" disabled>确认摆正</button>
                <button type="button" id="cornerCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 答案遮挡 -->
    <div id="maskModal" class="modal" hidden>
        <div class="modal-content mask-content">
            <h3>遮住答案</h3>
            <p class="hint">在图上拖框遮住孩子的答案或老师的批改痕迹。原图不会改变。</p>
            <canvas id="maskCanvas"></canvas>
            <div id="maskList" class="mask-list"></div>
            <div class="modal-actions">
                <button type="button" id="maskClearBtn" class="btn">清空遮挡</button>
                <button type="button" id="maskSaveBtn" class="btn btn-primary">保存遮挡</button>
                <button type="button" id="maskCancelBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 大图查看 -->
    <div id="lightbox" class="modal" hidden>
        <div class="lightbox-content">
            <img id="lightboxImg" alt="题目大图">
            <button type="button" id="lightboxCloseBtn" class="btn">关闭</button>
        </div>
    </div>

    <script src="/static/app.js?v=20261018-name"></script>
</body>
</html>
